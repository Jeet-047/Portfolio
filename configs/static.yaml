pipeline_workflows:
  - id: "mlops"
    label: "MLOps Pipeline"
    accent: "indigo"
    description: "End-to-end machine learning lifecycle from raw data to monitored, versioned cloud deployments."
    steps:
      - icon: "database"
        title: "Data Ingestion"
        desc: "Collect, validate & version raw datasets from multiple sources."
        color: "indigo"
      - icon: "cpu"
        title: "Feature Engineering"
        desc: "Transform, normalize & select features for optimal model input."
        color: "violet"
      - icon: "brain"
        title: "Model Training"
        desc: "Train & tune models with experiment tracking via MLflow / DVC."
        color: "purple"
      - icon: "line-chart"
        title: "Evaluation"
        desc: "Rigorous validation, A/B testing & performance benchmarking."
        color: "rose"
      - icon: "git-merge"
        title: "CI/CD & Registry"
        desc: "Automated pipelines, version-controlled model registry on S3."
        color: "amber"
      - icon: "rocket"
        title: "Cloud Deploy"
        desc: "Containerized deployment on AWS EC2 / Render with monitoring."
        color: "emerald"

  - id: "llm_rag"
    label: "LLM / RAG Pipeline"
    accent: "fuchsia"
    description: "Full retrieval-augmented generation stack from raw documents to low-latency, grounded AI responses."
    steps:
      - icon: "file-text"
        title: "Document Ingestion"
        desc: "Parse PDFs, DOCX, URLs & clean content into structured chunks."
        color: "fuchsia"
      - icon: "braces"
        title: "Chunking & Embedding"
        desc: "Semantic splitting & vector embedding via sentence transformers."
        color: "pink"
      - icon: "database-zap"
        title: "Vector Store"
        desc: "Store & index embeddings in FAISS / ChromaDB for fast ANN search."
        color: "rose"
      - icon: "search"
        title: "Retrieval & Re-ranking"
        desc: "Cosine similarity retrieval + cross-encoder re-ranking for precision."
        color: "orange"
      - icon: "message-square-text"
        title: "LLM Generation"
        desc: "Grounded response synthesis with chain-of-thought prompting."
        color: "amber"
      - icon: "zap"
        title: "API Serving"
        desc: "Low-latency FastAPI endpoint with streaming & rate limiting."
        color: "emerald"

